<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diia.gov.ua</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Top Navigation / Header -->
    <header class="navbar">
        <div class="logo">Дія</div>
    </header>

    <!-- Main Chat Area -->
    <main class="chat-container">
        
        <!-- Welcome Message -->
        <h1 class="greeting">Hello!</h1>

        <!-- Chat History -->
        <div class="chat-history">
            <div class="message ai-message">AI text placeholder</div>
            <div class="message user-message">User text placeholder</div>
        </div>

    </main>

    <!-- Bottom Input Area -->
    <footer class="input-section">
        <div class="input-wrapper">
            <input type="text" placeholder="Type a message...">
            <button>Send</button>
        </div>
    </footer>

          <!-- JavaScript to make the Send button work -->
    <script>
        const sendButton = document.querySelector('button');
        const inputField = document.querySelector('input');
        const chatHistory = document.querySelector('.chat-history');

        // Listen for the Enter key
        inputField.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendButton.click();
            }
        });

        sendButton.addEventListener('click', function() {
            const userText = inputField.value;

            if (userText.trim() !== '') {
                // Add the user's message
                const newMessage = document.createElement('div');
                newMessage.className = 'message user-message';
                newMessage.textContent = userText;
                chatHistory.appendChild(newMessage);

                // Clear the text box
                inputField.value = '';

                // Scroll to bottom after user sends a message
                chatHistory.scrollTop = chatHistory.scrollHeight;

                // Simulate an AI reply
                setTimeout(function() {
                    const aiMessage = document.createElement('div');
                    aiMessage.className = 'message ai-message';
                    aiMessage.textContent = "This is a simulated AI response!";
                    chatHistory.appendChild(aiMessage);

                    // Scroll to bottom again after AI replies
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }, 1000); 
            }
        });
    </script>
</body>
</html>
