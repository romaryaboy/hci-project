<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diia.AI — Government Services</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- WarpMind Library for LLM Integration -->
    <script src="https://warp.cs.au.dk/libs/warpmind.js"></script>
</head>
<body>
    
    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">Дія</div>
            <button class="icon-btn new-chat-btn" title="New Chat">✎</button>
        </div>

        <div class="search-bar">
            <span>🔍</span>
            <input type="text" placeholder="Search in chats">
        </div>

        <div class="chat-list-section">
            <div class="section-title">PREVIOUS CHATS</div>
            <div class="chat-item active" data-chat="chat1">Government Services</div>
            <div class="chat-item" data-chat="chat2">Passport Expiration</div>
            <div class="chat-item" data-chat="chat3">Other</div>
        </div>

        <div class="sidebar-footer">
            <button class="icon-btn text-btn">
                <span>?</span> Help
            </button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main-content">
        
        <!-- Top Header -->
        <header class="chat-header">
            <button class="icon-btn">←</button>
            <h1 class="chat-title">Government Services</h1>
            <button class="icon-btn">✕</button>
        </header>

        <!-- Scrollable Messages -->
        <div class="chat-history"></div>

        <!-- Input Section -->
        <footer class="input-section">
            <div class="input-container">
                <div class="input-wrapper blue-border">
                    <input type="text" placeholder="How can I help?">
                    <button class="voice-btn send-btn">→</button>
                </div>
                <p class="disclaimer">The AI assistant is currently operating in open beta testing. Please verify important information on the Diia portal.</p>
            </div>
        </footer>
    </main>

    <!-- Application Logic -->
    <script src="script.js"></script>
</body>
</html>
