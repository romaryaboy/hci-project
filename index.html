<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diia Simplified</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Top Navigation -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo">Diia</div>
            <span>Service Catalog ▾</span>
            <span>What is Diia</span>
        </div>
        <div class="nav-right">
            <span class="register">Register</span>
            <button class="login-btn">Log in</button>
        </div>
    </header>

    <!-- Main Centered Area -->
    <main class="hero-container">
        
        <h1 class="main-title">Online Government Services</h1>

        <!-- Chat History is now ABOVE the input area -->
        <div class="chat-history"></div>

        <!-- Mode Toggles (Search / AI) -->
        <div class="mode-toggles">
            <button class="active-toggle">Search</button>
            <button class="inactive-toggle">Diia.AI</button>
        </div>

        <!-- Input Area -->
        <div class="input-wrapper">
            <input type="text" placeholder="Name of service or life situation">
            <button class="send-btn">→</button>
        </div>
        <p class="subtext">For example: open a sole proprietorship or Entrepreneurship</p>

    </main>

    <script>
        const sendButton = document.querySelector('.send-btn');
        const inputField = document.querySelector('input');
        const chatHistory = document.querySelector('.chat-history');
        const mainTitle = document.querySelector('.main-title');
        const modeToggles = document.querySelector('.mode-toggles');
        
        // 1. Grab the two toggle buttons
        const searchBtn = modeToggles.children[0];
        const aiBtn = modeToggles.children[1];

        // 2. Add click listeners to swap their classes
        searchBtn.addEventListener('click', function() {
            searchBtn.className = 'active-toggle';
            aiBtn.className = 'inactive-toggle';
        });

        aiBtn.addEventListener('click', function() {
            aiBtn.className = 'active-toggle';
            searchBtn.className = 'inactive-toggle';
        });

        // The rest of your chat functionality remains completely unchanged
        inputField.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendButton.click();
            }
        });

        sendButton.addEventListener('click', function() {
            const userText = inputField.value;

            if (userText.trim() !== '') {
                mainTitle.style.display = 'none';
                modeToggles.style.display = 'none';

                const newMessage = document.createElement('div');
                newMessage.className = 'message user-message';
                newMessage.textContent = userText;
                chatHistory.appendChild(newMessage);

                inputField.value = '';
                chatHistory.scrollTop = chatHistory.scrollHeight;

                setTimeout(function() {
                    const aiMessage = document.createElement('div');
                    aiMessage.className = 'message ai-message';
                    aiMessage.textContent = "Looking for information regarding your request...";
                    chatHistory.appendChild(aiMessage);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }, 1000); 
            }
        });
    </script>
</body>
</html>
