<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UI Skeleton</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Top Navigation / Header -->
    <header class="navbar">
        <div class="logo">Дія</div>
        <!-- Add your profile button or links here -->
    </header>

    <!-- Main Chat Area -->
    <main class="chat-container">
        
        <!-- Welcome Message -->
        <h1 class="greeting">Hello!</h1>

        <!-- Chat History -->
        <div class="chat-history">
            <!-- Add your AI and User message bubbles here -->
            <div class="message ai-message">AI text placeholder</div>
            <div class="message user-message">User text placeholder</div>
        </div>

    </main>

    <!-- Bottom Input Area -->
    <footer class="input-section">
        <div class="input-wrapper">
            <!-- Text input and send button go here -->
            <input type="text" placeholder="Type a message...">
            <button>Send</button>
        </div>
    </footer>

</body>
</html>
